name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Reads apps/docs/out, which only exists after the build above, so it
      # runs here rather than in the test job.
      - name: Verify docs lang and dir
        run: bun run --cwd apps/docs verify:html-lang

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifacts
          path: packages/fasla-ui/dist
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  # The registry must always install with the official shadcn CLI, not only
  # with ours. This builds it from the PR, serves it locally, and installs every
  # item into a fresh Next.js app through the @fasla namespace, then runs tsc.
  # shadcn is @latest on purpose — it is what developers run — so a failure
  # here can also mean a new shadcn release broke something.
  shadcn-registry:
    name: Registry installs with shadcn
    runs-on: ubuntu-latest
    # It runs code fetched at run time (shadcn, create-next-app and their
    # packages), so it gets read-only access and no token left in .git/config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The registry build uses only Node's standard library, so no bun install.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install every item with shadcn and type-check
        run: bash apps/docs/scripts/check-shadcn-install.sh
        env:
          SHADCN_VERSION: latest
          NEXT_VERSION: "16"

  # Every item must also build in the oldest stack Fasla supports. This builds
  # the CLI and the registry from the PR, installs every item into a fresh
  # Next.js 14 app (React 18, Tailwind 3) with the CLI in @smicolon/fasla-ui,
  # then runs tsc and `next build` with Next's ESLint config, which fails on
  # lint errors.
  next14-build:
    name: Registry builds on Next.js 14
    runs-on: ubuntu-latest
    # It runs code fetched at run time (create-next-app and the items'
    # packages), so it gets read-only access and no token left in .git/config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # For the CLI build; the app itself installs with npm.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install every item into Next.js 14 and build
        run: bash apps/docs/scripts/check-next14-build.sh

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Storybook
        run: bun run build-storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storybook
          path: apps/storybook/storybook-static
          retention-days: 7
