name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Reads apps/docs/out, which only exists after the build above, so it
      # runs here rather than in the test job.
      - name: Verify docs lang and dir
        run: bun run --cwd apps/docs verify:html-lang

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/fasla-ui/dist
            packages/cli/dist
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  # The registry must always install with the official shadcn CLI, not only
  # with ours. This builds it from the PR, serves it locally, and installs every
  # item into a fresh Next.js app through the @fasla namespace, then runs tsc.
  # shadcn is @latest on purpose — it is what developers run — so a failure
  # here can also mean a new shadcn release broke something.
  shadcn-registry:
    name: Registry installs with shadcn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The registry build uses only Node's standard library, so no bun install.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install every item with shadcn and type-check
        run: bash apps/docs/scripts/check-shadcn-install.sh
        env:
          SHADCN_VERSION: latest
          NEXT_VERSION: "16"

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Storybook
        run: bun run build-storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: apps/storybook/storybook-static
          retention-days: 7
