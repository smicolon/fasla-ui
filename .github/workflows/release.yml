name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps a rolling "chore: release packages" PR up to date from the conventional
  # commits on main. Merging that PR bumps versions, writes CHANGELOGs, tags and
  # cuts GitHub releases — which is what triggers the publish job below.
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.0 or newer.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.9.0

      # Published via npm trusted publishing: the job's OIDC token (id-token:
      # write, above) is exchanged for a short-lived credential, so there is no
      # NPM_TOKEN here and no long-lived secret to leak or rotate. npm attaches
      # the provenance attestation itself, so --provenance is not passed.
      #
      # Each package needs a trusted publisher configured once on npmjs.com,
      # pointing at smicolon/fasla-ui and this workflow file (release.yml).
      #
      # Only the packages release-please actually bumped get published, so a
      # release that touches one package does not try to republish the other at
      # a version npm already has.
      - name: Publish released packages
        run: |
          printf '%s' "$PATHS_RELEASED" \
            | jq -r '.[]' \
            | while read -r pkg; do
                echo "::group::publishing $pkg"
                ( cd "$pkg" && npm publish --access public )
                echo "::endgroup::"
              done
        env:
          # Never inline ${{ }} into the script body — keep it a quoted env var.
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
