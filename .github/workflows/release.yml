name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps a rolling "chore: release packages" PR up to date from the conventional
  # commits on main. Merging that PR bumps versions, writes CHANGELOGs, tags and
  # cuts GitHub releases — which is what triggers the publish job below.
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # Only the packages release-please actually bumped get published, so a
      # release that touches one package does not try to republish the other at
      # a version npm already has.
      - name: Publish released packages
        run: |
          printf '%s' "$PATHS_RELEASED" \
            | jq -r '.[]' \
            | while read -r pkg; do
                echo "::group::publishing $pkg"
                ( cd "$pkg" && npm publish --access public --provenance )
                echo "::endgroup::"
              done
        env:
          # Never inline ${{ }} into the script body — keep it a quoted env var.
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
