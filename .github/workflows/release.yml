name: Release

on:
  push:
    branches:
      - main
  # Manual runs. Without a tag, a DRY RUN: builds and packs, then runs
  # `npm publish --dry-run` on the tarball, from any branch:
  #   gh workflow run release.yml --ref <branch>
  # With a tag, publishes that existing release tag, when a push could not
  # (the release was cut but the publish failed). Only from main:
  #   gh workflow run release.yml --ref main -f tag=fasla-ui-v0.9.0
  # Neither touches release-please.
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to publish, such as fasla-ui-v0.9.0. Empty: dry run only."
        required: false
        default: ""
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Read-only by default. Each job below asks for exactly what it needs.
permissions:
  contents: read

jobs:
  # Keeps a rolling "chore: release packages" PR up to date from the conventional
  # commits on main. Merging that PR bumps versions, writes CHANGELOGs, tags and
  # cuts GitHub releases — which is what triggers the build and publish jobs below.
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    # Manual runs are a dry run only: release-please must not run for them.
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # Installs, builds and packs. This job runs third-party install and build
  # scripts, so it has read-only access, keeps no token in .git/config and has
  # no id-token: it cannot publish. It hands the packed tarballs to the publish
  # job as an artifact.
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    needs: release-please
    # `!cancelled()` lets this job run on a manual run, where release-please is
    # skipped. On a push it runs only when release-please cut a release.
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.releases_created == 'true'
      ) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # A manual publish builds the tag it was given; everything else, this run's commit.
          ref: ${{ inputs.tag || github.sha }}

      # A manual publish only builds a release tag whose package version is
      # the tag's own, so it can never publish anything but that release.
      - name: Check the release tag
        if: inputs.tag != ''
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^fasla-ui-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::$TAG is not a fasla-ui release tag"; exit 1; }
          want="${BASH_REMATCH[1]}"
          have="$(jq -r .version packages/fasla-ui/package.json)"
          [ "$have" = "$want" ] || { echo "::error::$TAG holds version $have, not $want"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")" ] || { echo "::error::checked out commit is not $TAG"; exit 1; }
          echo "Publishing $TAG: @smicolon/fasla-ui $have"
        env:
          # Never inline ${{ }} into the script body — keep it a quoted env var.
          TAG: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      # On a push, only the packages release-please actually bumped are packed,
      # so a release that touches one package does not try to republish another
      # at a version npm already has. On a manual run, every package in the
      # release-please config is packed.
      - name: Pack packages
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            paths="$PATHS_RELEASED"
          else
            paths="$(jq -c '.packages | keys' release-please-config.json)"
          fi
          mkdir -p "$GITHUB_WORKSPACE/tarballs"
          printf '%s' "$paths" \
            | jq -r '.[]' \
            | while read -r pkg; do
                echo "::group::packing $pkg"
                ( cd "$pkg" && npm pack --pack-destination "$GITHUB_WORKSPACE/tarballs" )
                echo "::endgroup::"
              done
          ls -l "$GITHUB_WORKSPACE/tarballs"
          test -n "$(ls -A "$GITHUB_WORKSPACE/tarballs")"
        env:
          # Never inline ${{ }} into the script body — keep it a quoted env var.
          EVENT_NAME: ${{ github.event_name }}
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}

      - name: Upload tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarballs
          path: tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Publishes exactly the tarballs the build job packed. It holds id-token:
  # write, so it installs nothing and builds nothing: no bun, no `npm install`,
  # no package scripts. Only pinned actions, the artifact, and `npm publish`.
  #
  # Published via npm trusted publishing: the job's OIDC token is exchanged for
  # a short-lived credential, so there is no NPM_TOKEN here and no long-lived
  # secret to leak or rotate. Each package needs a trusted publisher configured
  # once on npmjs.com, pointing at smicolon/fasla-ui and this workflow file
  # (release.yml).
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release-please, build]
    # On a push, when release-please cut a release. On a manual run, only with
    # a tag and only from main, so a branch's copy of this file cannot publish.
    # `!cancelled()` because release-please is skipped on a manual run, and an
    # `if` without a status function would then be false.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && (
        (github.event_name == 'push' &&
          needs.release-please.outputs.releases_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '' &&
          github.ref == 'refs/heads/main')
      ) }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Node 24.14.0 bundles npm 11.9.0. Trusted publishing needs npm 11.5.1 or
      # newer, and bundling it means nothing is installed in this job.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          v="$(npm --version)"
          echo "npm $v"
          # sort -C succeeds when its input is already in order: 11.5.1, then
          # this npm. The other order passed only npm 11.5.1 and older.
          printf '11.5.1\n%s\n' "$v" | sort -V -C || { echo "::error::npm $v is older than 11.5.1"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: tarballs

      - name: Publish tarballs with provenance
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./tarballs/*.tgz)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no tarballs to publish"; exit 1; }
          for f in "${files[@]}"; do
            echo "::group::publishing $f"
            npm publish "$f" --access public --provenance
            echo "::endgroup::"
          done

  # Manual runs only. Same artifact, same `npm publish`, but --dry-run: nothing
  # is published. It has no id-token, so it can never publish even by mistake.
  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    needs: build
    # `!cancelled()` is needed: on a manual run release-please is skipped, and
    # the implicit success() of an `if` without a status function is false when
    # any job earlier in the chain was skipped.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.tag == '' && needs.build.result == 'success' }}
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.0"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarballs
          path: tarballs

      - name: Dry-run publish
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./tarballs/*.tgz)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no tarballs to publish"; exit 1; }
          for f in "${files[@]}"; do
            echo "::group::dry run $f"
            # Not `tar | head`: head closes the pipe early, tar then dies on
            # SIGPIPE, and pipefail turns that into a failed step.
            tar -tzf "$f" > "$RUNNER_TEMP/listing.txt"
            echo "$(wc -l < "$RUNNER_TEMP/listing.txt") files in $f; first 50:"
            head -n 50 "$RUNNER_TEMP/listing.txt"
            # A dry run on a version npm already has fails with "You cannot
            # publish over the previously published versions". That is the
            # normal case on a manual run between releases, so it is reported
            # as a notice, not a failure. Any other error still fails the run.
            if ! out="$(npm publish "$f" --access public --dry-run 2>&1)"; then
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -q "previously published"; then
                echo "::notice::$f is already on npm, so npm refused the dry run on that check only. The tarball itself packed and was read fine."
              else
                exit 1
              fi
            else
              printf '%s\n' "$out"
            fi
            echo "::endgroup::"
          done
